[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenops"
version = "0.1.0"
authors = [
    { name = "Mohan", email = "mohan@example.com" }
]
description = "A developer-first, open-source Python SDK & CLI for LLM cost governance."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pyyaml>=6.0",
    "openai>=1.0.0",
    "tiktoken>=0.3.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.3.0"]

[project.scripts]
tokenops = "tokenops.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tokenops*"]
